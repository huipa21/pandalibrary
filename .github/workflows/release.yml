name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build embedded web assets
        run: pnpm --dir web build
      - name: Install Task and staticcheck
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run Go checks
        run: |
          task build
          task lint
          task test
      - name: Run web checks
        run: |
          pnpm --dir web check
          pnpm --dir web test
      - name: Build versioned E2E binary
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p bin dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_VERSION}" -o bin/pandalibrary ./cmd/pandalibrary
      - name: Install Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Run full browser suite against the release binary
        env:
          PANDA_E2E_BINARY: ${{ github.workspace }}/bin/pandalibrary
        run: pnpm --dir web test:e2e
      - name: Keep browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-results
          path: web/test-results
          retention-days: 7
      - name: Reuse the most recent prior release database
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          previous="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select(.tagName != env.RELEASE_TAG and (.isDraft | not) and (.isPrerelease | not))] | sort_by(.publishedAt) | last | .tagName // ""')"
          if [ -n "$previous" ]; then
            assets="$(gh release view "$previous" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$assets" | grep -Fx pandalibrary-linux-amd64 >/dev/null; then
              mkdir -p previous
              gh release download "$previous" --pattern pandalibrary-linux-amd64 --dir previous
              chmod +x previous/pandalibrary-linux-amd64
              echo "PANDA_PREVIOUS_BINARY=$GITHUB_WORKSPACE/previous/pandalibrary-linux-amd64" >> "$GITHUB_ENV"
            else
              echo "::notice::Prior release $previous has no Linux amd64 binary; using the generated schema baseline."
            fi
          else
            echo "::notice::No prior published release; using the generated first-release schema baseline."
          fi
      - name: Check automatic upgrade and retained data
        env:
          PANDA_CANDIDATE_BINARY: ${{ github.workspace }}/bin/pandalibrary
        run: node web/scripts/upgrade-check.mjs
      - name: Build and verify scratch container
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: node web/scripts/container-check.mjs
      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_VERSION}" -o dist/pandalibrary-linux-amd64 ./cmd/pandalibrary
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_VERSION}" -o dist/pandalibrary-linux-arm64 ./cmd/pandalibrary
      - name: Upload binaries to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/pandalibrary-linux-amd64 dist/pandalibrary-linux-arm64 --clobber
