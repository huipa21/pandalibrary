name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build embedded web assets
        run: pnpm --dir web build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Add Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Test portable provenance wrapper
        run: node --test scripts/build.test.mjs
      - name: Build
        run: task build
      - name: Lint
        run: task lint
      - name: Test
        run: task test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check
        working-directory: web
        run: pnpm check
      - name: Test
        working-directory: web
        run: pnpm test
      - name: Build
        working-directory: web
        run: pnpm build

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build embedded web assets
        run: pnpm --dir web build
      - name: Build real-server E2E binary
        run: |
          mkdir -p bin
          node scripts/build-binary.mjs --output bin/pandalibrary
      - name: Install Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Check standalone version footer in a browser
        run: node web/scripts/build-version-check.mjs
      - name: Run Playwright against the compiled server
        env:
          PANDA_E2E_BINARY: ${{ github.workspace }}/bin/pandalibrary
        run: pnpm --dir web test:e2e
      - name: Keep browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7
      - name: Reuse the most recent released binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select((.isDraft | not) and (.isPrerelease | not))] | sort_by(.publishedAt) | last | .tagName // ""')"
          if [ -n "$previous" ]; then
            assets="$(gh release view "$previous" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$assets" | grep -Fx pandalibrary-linux-amd64 >/dev/null; then
              mkdir -p previous
              gh release download "$previous" --pattern pandalibrary-linux-amd64 --dir previous
              chmod +x previous/pandalibrary-linux-amd64
              echo "PANDA_PREVIOUS_BINARY=$GITHUB_WORKSPACE/previous/pandalibrary-linux-amd64" >> "$GITHUB_ENV"
            else
              echo "::notice::Prior release $previous has no Linux amd64 binary; using the generated schema baseline."
            fi
          else
            echo "::notice::No prior published release; using the generated first-release schema baseline."
          fi
      - name: Check startup migration upgrade
        env:
          PANDA_CANDIDATE_BINARY: ${{ github.workspace }}/bin/pandalibrary
        run: node web/scripts/upgrade-check.mjs
      - name: Build and verify the scratch container
        run: node web/scripts/container-check.mjs
