<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!-- The OCR fixture asks for SimSun. Map common Windows/macOS CJK families
	     to the Noto CJK faces shipped in the OCR browser-test image. -->
	<alias binding="same">
		<family>SimSun</family>
		<prefer><family>Noto Serif CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>宋体</family>
		<prefer><family>Noto Serif CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>NSimSun</family>
		<prefer><family>Noto Serif CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>新宋体</family>
		<prefer><family>Noto Serif CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>Microsoft YaHei</family>
		<prefer><family>Noto Sans CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>Microsoft YaHei UI</family>
		<prefer><family>Noto Sans CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>微软雅黑</family>
		<prefer><family>Noto Sans CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>SimHei</family>
		<prefer><family>Noto Sans CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>黑体</family>
		<prefer><family>Noto Sans CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>Microsoft JhengHei</family>
		<prefer><family>Noto Sans CJK TC</family></prefer>
	</alias>
	<alias binding="same">
		<family>PingFang SC</family>
		<prefer><family>Noto Sans CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>Hiragino Sans GB</family>
		<prefer><family>Noto Sans CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>Songti SC</family>
		<prefer><family>Noto Serif CJK SC</family></prefer>
	</alias>
	<alias binding="same">
		<family>PMingLiU</family>
		<prefer><family>Noto Serif CJK TC</family></prefer>
	</alias>
	<alias binding="same">
		<family>MingLiU</family>
		<prefer><family>Noto Serif CJK TC</family></prefer>
	</alias>
	<alias binding="same">
		<family>MS Gothic</family>
		<prefer><family>Noto Sans CJK JP</family></prefer>
	</alias>
	<alias binding="same">
		<family>Yu Gothic</family>
		<prefer><family>Noto Sans CJK JP</family></prefer>
	</alias>
	<alias binding="same">
		<family>Meiryo</family>
		<prefer><family>Noto Sans CJK JP</family></prefer>
	</alias>
	<alias binding="same">
		<family>Hiragino Kaku Gothic ProN</family>
		<prefer><family>Noto Sans CJK JP</family></prefer>
	</alias>
	<alias binding="same">
		<family>Malgun Gothic</family>
		<prefer><family>Noto Sans CJK KR</family></prefer>
	</alias>
	<alias binding="same">
		<family>Apple SD Gothic Neo</family>
		<prefer><family>Noto Sans CJK KR</family></prefer>
	</alias>
	<!-- Keep Latin substitutions metric-compatible with the Windows families
	     used by browser fixtures. -->
	<alias binding="same">
		<family>Arial</family>
		<prefer><family>Liberation Sans</family></prefer>
	</alias>
	<alias binding="same">
		<family>Times New Roman</family>
		<prefer><family>Liberation Serif</family></prefer>
	</alias>
	<alias binding="same">
		<family>Courier New</family>
		<prefer><family>Liberation Mono</family></prefer>
	</alias>
</fontconfig>
