services:
  pandalibrary:
    image: localhost/pandalibrary:latest
    pull_policy: never
    restart: unless-stopped
    user: "1000:1000"
    # For rootless Podman on Linux, uncomment to map the host user's IDs.
    # userns_mode: keep-id
    environment:
      PANDA_BASE_URL: ${PANDA_BASE_URL:?Set PANDA_BASE_URL to the public HTTPS origin}
      PANDA_TRUSTED_PROXIES: ${PANDA_TRUSTED_PROXIES:-}
    volumes:
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    name: pandalibrary-proxy
